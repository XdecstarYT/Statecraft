<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Statecraft Engine</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --panel-2: #1e232b;
    --border: #2a313c;
    --text: #e7ebf0;
    --text-dim: #97a1ad;
    --accent: #c9963a;
    --accent-dim: #7a6027;
    --user-bubble: #23334a;
    --gm-bubble: #1e232b;
    --danger: #b4553f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar */
  #sidebar {
    width: 260px; min-width: 260px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #sidebar-header {
    padding: 16px; border-bottom: 1px solid var(--border);
  }
  #sidebar-header h1 {
    font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase;
    margin: 0 0 2px 0; color: var(--accent);
  }
  #sidebar-header p { margin: 0; font-size: 11px; color: var(--text-dim); }
  #new-game-btn {
    margin: 12px; padding: 10px; border-radius: 6px;
    background: var(--accent); color: #1a1305; border: none;
    font-weight: 600; cursor: pointer; font-size: 13px;
  }
  #new-game-btn:hover { filter: brightness(1.08); }
  #game-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; }
  .game-item {
    padding: 10px 10px; border-radius: 6px; cursor: pointer;
    margin-bottom: 4px; font-size: 13px; color: var(--text-dim);
    border: 1px solid transparent;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .game-item:hover { background: var(--panel-2); }
  .game-item.active { background: var(--panel-2); color: var(--text); border-color: var(--border); }
  .game-item .title {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
  }
  .game-item .del-btn {
    opacity: 0; background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 14px; line-height: 1; padding: 2px 4px;
  }
  .game-item:hover .del-btn { opacity: 1; }
  .game-item .del-btn:hover { color: var(--danger); }
  #sidebar-footer {
    padding: 10px 12px; border-top: 1px solid var(--border);
    font-size: 10.5px; color: var(--text-dim); line-height: 1.5;
  }

  /* Main */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #chat-header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  #chat-title { font-size: 14px; font-weight: 600; }
  #chat-title[contenteditable="true"] { outline: none; border-bottom: 1px dashed var(--border); cursor: text; }
  #model-tag { font-size: 11px; color: var(--text-dim); }

  #messages {
    flex: 1; overflow-y: auto; padding: 20px 0;
    display: flex; flex-direction: column; gap: 14px;
  }
  .msg-row { display: flex; padding: 0 20px; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.gm { justify-content: flex-start; }
  .bubble {
    max-width: 72ch; padding: 12px 16px; border-radius: 10px;
    font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word;
  }
  .msg-row.user .bubble { background: var(--user-bubble); border: 1px solid #2c4467; }
  .msg-row.gm .bubble {
    background: var(--gm-bubble); border: 1px solid var(--border);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13.5px;
  }
  .msg-row.gm .bubble .prose { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .empty-state {
    margin: auto; text-align: center; color: var(--text-dim); max-width: 480px; padding: 20px;
  }
  .empty-state h2 { color: var(--text); font-size: 17px; margin-bottom: 8px; }
  .empty-state p { font-size: 13px; line-height: 1.6; }

  #quick-commands {
    display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 20px;
    border-top: 1px solid var(--border);
  }
  .qc-btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim);
    font-size: 11.5px; padding: 5px 10px; border-radius: 999px; cursor: pointer;
  }
  .qc-btn:hover { color: var(--accent); border-color: var(--accent-dim); }

  #input-bar {
    display: flex; gap: 10px; padding: 14px 20px 18px;
    border-top: 1px solid var(--border); align-items: flex-end;
  }
  #input-box {
    flex: 1; resize: none; min-height: 44px; max-height: 200px;
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: 11px 14px; font-size: 14px; font-family: inherit;
    line-height: 1.4;
  }
  #input-box:focus { outline: none; border-color: var(--accent-dim); }
  #send-btn {
    background: var(--accent); color: #1a1305; border: none; border-radius: 8px;
    padding: 0 20px; height: 44px; font-weight: 600; cursor: pointer; font-size: 13.5px;
  }
  #send-btn:disabled { opacity: 0.5; cursor: default; }

  #status-line {
    padding: 0 20px 8px; font-size: 11.5px; color: var(--text-dim); min-height: 16px;
  }
  #status-line.error { color: var(--danger); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #2c333c; border-radius: 4px; }
</style>
</head>
<body>

  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Statecraft</h1>
      <p>Your political simulation, run by Claude.</p>
    </div>
    <button id="new-game-btn">+ New Game</button>
    <div id="game-list"></div>
    <div id="sidebar-footer">
      Saved locally in this browser. Clearing site data erases your games.
    </div>
  </div>

  <div id="main">
    <div id="chat-header">
      <div id="chat-title" contenteditable="true" spellcheck="false"></div>
      <div id="model-tag"></div>
    </div>
    <div id="messages"></div>
    <div id="status-line"></div>
    <div id="quick-commands"></div>
    <div id="input-bar">
      <textarea id="input-box" placeholder="Describe your action…" rows="1"></textarea>
      <button id="send-btn">Send</button>
    </div>
  </div>

<script>
(function () {
  const STORAGE_KEY = 'statecraft.games.v1';
  const QUICK_COMMANDS = [
    '/status', '/brief', '/draft bill', '/whip', '/press',
    '/relationships', '/fastforward 4', '/legacy'
  ];

  const el = {
    gameList: document.getElementById('game-list'),
    newGameBtn: document.getElementById('new-game-btn'),
    chatTitle: document.getElementById('chat-title'),
    modelTag: document.getElementById('model-tag'),
    messages: document.getElementById('messages'),
    inputBox: document.getElementById('input-box'),
    sendBtn: document.getElementById('send-btn'),
    statusLine: document.getElementById('status-line'),
    quickCommands: document.getElementById('quick-commands'),
  };

  let state = { games: [], activeId: null };
  let sending = false;

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) state = JSON.parse(raw);
    } catch (e) { console.error('Failed to load saved games', e); }
    if (!state.games) state.games = [];
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function newGame() {
    const game = {
      id: 'g_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      title: 'New Game',
      messages: [],
      createdAt: Date.now(),
    };
    state.games.unshift(game);
    state.activeId = game.id;
    save();
    renderAll();
    el.inputBox.value =
      "Let's begin. Run Session Zero: help me pick a setting and build my world, then create my character.";
    el.inputBox.focus();
  }

  function activeGame() {
    return state.games.find((g) => g.id === state.activeId) || null;
  }

  function deleteGame(id, ev) {
    ev.stopPropagation();
    if (!confirm('Delete this game? This cannot be undone.')) return;
    state.games = state.games.filter((g) => g.id !== id);
    if (state.activeId === id) {
      state.activeId = state.games.length ? state.games[0].id : null;
    }
    save();
    renderAll();
  }

  function selectGame(id) {
    state.activeId = id;
    save();
    renderAll();
  }

  function renderSidebar() {
    el.gameList.innerHTML = '';
    for (const g of state.games) {
      const item = document.createElement('div');
      item.className = 'game-item' + (g.id === state.activeId ? ' active' : '');
      item.onclick = () => selectGame(g.id);

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = g.title || 'Untitled Game';
      item.appendChild(title);

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.textContent = '✕';
      del.title = 'Delete game';
      del.onclick = (ev) => deleteGame(g.id, ev);
      item.appendChild(del);

      el.gameList.appendChild(item);
    }
  }

  function renderMessages() {
    const game = activeGame();
    el.messages.innerHTML = '';
    if (!game || !game.messages.length) {
      const empty = document.createElement('div');
      empty.className = 'empty-state';
      empty.innerHTML = game
        ? '<h2>' + escapeHtml(game.title) + '</h2><p>Send a message to begin, or use the quick commands below.</p>'
        : '<h2>No game selected</h2><p>Start a new game from the sidebar to begin your political career.</p>';
      el.messages.appendChild(empty);
      return;
    }
    for (const m of game.messages) {
      el.messages.appendChild(renderBubble(m.role, m.content));
    }
    el.messages.scrollTop = el.messages.scrollHeight;
  }

  function renderBubble(role, text) {
    const row = document.createElement('div');
    row.className = 'msg-row ' + (role === 'user' ? 'user' : 'gm');
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    return row;
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderHeader() {
    const game = activeGame();
    el.chatTitle.textContent = game ? (game.title || 'Untitled Game') : 'Statecraft';
    el.modelTag.textContent = game ? 'GM: Claude' : '';
    el.chatTitle.contentEditable = !!game;
  }

  function renderQuickCommands() {
    el.quickCommands.innerHTML = '';
    for (const cmd of QUICK_COMMANDS) {
      const btn = document.createElement('button');
      btn.className = 'qc-btn';
      btn.textContent = cmd;
      btn.onclick = () => {
        el.inputBox.value = cmd;
        el.inputBox.focus();
      };
      el.quickCommands.appendChild(btn);
    }
  }

  function renderAll() {
    renderSidebar();
    renderHeader();
    renderMessages();
    renderQuickCommands();
    const game = activeGame();
    el.inputBox.disabled = !game || sending;
    el.sendBtn.disabled = !game || sending;
  }

  function setStatus(text, isError) {
    el.statusLine.textContent = text || '';
    el.statusLine.className = 'error'.length && isError ? 'error' : '';
  }

  el.chatTitle.addEventListener('blur', () => {
    const game = activeGame();
    if (!game) return;
    const newTitle = el.chatTitle.textContent.trim() || 'Untitled Game';
    game.title = newTitle;
    save();
    renderSidebar();
  });
  el.chatTitle.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); el.chatTitle.blur(); }
  });

  el.newGameBtn.onclick = newGame;

  el.inputBox.addEventListener('input', () => {
    el.inputBox.style.height = 'auto';
    el.inputBox.style.height = Math.min(el.inputBox.scrollHeight, 200) + 'px';
  });
  el.inputBox.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });
  el.sendBtn.onclick = sendMessage;

  async function sendMessage() {
    const game = activeGame();
    if (!game || sending) return;
    const text = el.inputBox.value.trim();
    if (!text) return;

    game.messages.push({ role: 'user', content: text });
    if (game.messages.length === 1) {
      game.title = text.length > 42 ? text.slice(0, 42) + '…' : text;
    }
    save();
    el.inputBox.value = '';
    el.inputBox.style.height = 'auto';
    renderAll();

    sending = true;
    setStatus('The GM is thinking…');
    el.inputBox.disabled = true;
    el.sendBtn.disabled = true;

    const row = renderBubble('gm', '');
    el.messages.appendChild(row);
    const bubble = row.querySelector('.bubble');
    el.messages.scrollTop = el.messages.scrollHeight;

    let assistantText = '';

    try {
      const resp = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: game.messages }),
      });

      if (!resp.ok || !resp.body) {
        const errJson = await resp.json().catch(() => ({}));
        throw new Error(errJson.error || 'Request failed (' + resp.status + ')');
      }

      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let idx;
        while ((idx = buffer.indexOf('\n\n')) !== -1) {
          const rawEvent = buffer.slice(0, idx);
          buffer = buffer.slice(idx + 2);
          const evt = parseSseEvent(rawEvent);
          if (!evt) continue;

          if (evt.event === 'delta') {
            assistantText += evt.data.text || '';
            bubble.textContent = assistantText;
            el.messages.scrollTop = el.messages.scrollHeight;
          } else if (evt.event === 'error') {
            setStatus(evt.data.message || 'An error occurred.', true);
          } else if (evt.event === 'done') {
            if (evt.data.stop_reason && evt.data.stop_reason !== 'end_turn') {
              setStatus('Stopped: ' + evt.data.stop_reason, evt.data.stop_reason === 'refusal');
            } else {
              setStatus('');
            }
          }
        }
      }

      if (assistantText) {
        game.messages.push({ role: 'assistant', content: assistantText });
        save();
      } else {
        row.remove();
      }
    } catch (err) {
      console.error(err);
      setStatus(err.message || 'Something went wrong.', true);
      row.remove();
    } finally {
      sending = false;
      el.inputBox.disabled = false;
      el.sendBtn.disabled = false;
      el.inputBox.focus();
    }
  }

  function parseSseEvent(raw) {
    let eventName = 'message';
    let dataLine = '';
    for (const line of raw.split('\n')) {
      if (line.startsWith('event:')) eventName = line.slice(6).trim();
      else if (line.startsWith('data:')) dataLine += line.slice(5).trim();
    }
    if (!dataLine) return null;
    try {
      return { event: eventName, data: JSON.parse(dataLine) };
    } catch (e) {
      return null;
    }
  }

  load();
  if (!state.activeId && state.games.length) state.activeId = state.games[0].id;
  renderAll();
})();
</script>
</body>
</html>
